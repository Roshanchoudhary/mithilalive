<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - News Portal</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      font-family: 'Inter', system-ui, sans-serif;
      padding: 20px;
    }
    .offline-container {
      max-width: 500px;
      text-align: center;
    }
    .offline-icon {
      font-size: 80px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      color: #0f172a;
      margin-bottom: 10px;
    }
    p {
      color: #475569;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      margin-top: 20px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; }
      h1 { color: #f1f5f9; }
      p { color: #94a3b8; }
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      Looks like you've lost your internet connection. 
      Please check your network and try again.
    </p>
    <a href="/" class="btn">Try Again</a>
  </div>
</body>
</html>
